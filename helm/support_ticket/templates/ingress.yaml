apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticket-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: "ticket.local"
    http:
      paths:
      - pathType: Prefix
        path: "/api"
        backend:
          service:
            name: backend-service
            port:
              number: 5000
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: frontend-service
            port:
              number: 80