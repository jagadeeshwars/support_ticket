apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init-script
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS tickets (
      id SERIAL PRIMARY KEY,
      title VARCHAR(255) NOT NULL,
      description TEXT NOT NULL,
      status VARCHAR(50) DEFAULT 'open',
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    INSERT INTO tickets (title, description, status) VALUES
      ('Cannot connect to VPN', 'I am unable to connect to the corporate VPN from home.', 'open'),
      ('Laptop screen flickering', 'My external monitor is flickering when connected via HDMI.', 'open'),
      ('Password reset required', 'I forgot my password for the internal portal.', 'resolved');
