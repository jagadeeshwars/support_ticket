on:
  push:
    branches:
      - main
    paths-ignore:
      - 'K8s/**'
      - 'helm/**'

jobs:
  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ticket-frontend:${{ github.run_id }}
      
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ticket-backend:${{ github.run_id }}
  
  update-newtag-in-helm-chart:
    runs-on: ubuntu-latest

    needs: docker

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.TOKEN }}

    - name: Update tag in Helm chart
      run: |
        sed -i 's/tag: .*/tag: "${{github.run_id}}"/' helm/support_ticket/values.yaml

    - name: Commit and push changes
      run: |
        git config --global user.email "jagadeesh80155@gmail.com"
        git config --global user.name "jagadeeshwars"
        git add helm/support_ticket/values.yaml
        git commit -m "Update tag in Helm chart"
        git push
